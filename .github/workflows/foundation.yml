name: Build and test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate public foundation
        run: python3 scripts/check_foundation.py
      - name: Validate real-PBX verification tooling
        run: |
          bash -n scripts/setup-real-pbx-verification.sh
          node --check scripts/verify-real-pbx-compatibility.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Review resolved license identifiers
        run: python3 scripts/check_licenses.py
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
